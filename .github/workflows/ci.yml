name: CI

on:
  pull_request:
    # `edited`: a description fixed after the push re-runs the checks that read it. Every job runs
    # on it, so the newest `CI gate` on a commit always reflects all the checks.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  schedule:
    # The weekly run on main, off the hour: the full suite on a fresh runner image, so rot from
    # a new Xcode or runner shows up even in a week without merges.
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout-sanity:
    name: Checkout Sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify clean checkout
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"

  repo-shape:
    name: Workflow YAML And Script Shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow YAML and script shape
        run: script/ci-repo-shape.sh

      # The fast gates no other Ubuntu job runs. With these, the Ubuntu jobs run every gate
      # of check.sh's first stage, so the Build And Test shards skip it (ADR 0044 item 18).
      - name: Self-tests of the scripts' rules
        run: |
          set -euo pipefail
          script/guard-app-folder.sh check
          script/guard-app-folder.sh self-test
          /usr/bin/python3 -I script/lib/scorecard_test.py
          script/perf.sh self-test
          /usr/bin/python3 -I script/lib/test-shards.py self-test
          script/release-test.sh
          script/ci-tested-tree.sh self-test
          script/requirements-authority-check.sh self-test

  text-hygiene:
    name: Text Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace, conflict markers, requirement authority, and tagged time
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          script/ci-text-hygiene.sh check
          script/requirements-authority-check.sh
          script/time-guard.sh

  # Requirements, Validates tags and doc links agree (script/process-check); on a pull request,
  # its description fills the template and a `fix` changes a test (script/pr-check).
  process:
    name: Process
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pr-check diffs the pull request's base and head
          persist-credentials: false
      - name: process-check
        run: script/process-check
      - name: pr-check
        if: github.event_name == 'pull_request'
        run: script/pr-check

  lint:
    name: SwiftFormat And SwiftLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `script/lint.sh` fetches the pinned, checksummed SwiftFormat and SwiftLint
      # itself (`script/lint-tools.sh`) and never uses whatever the image ships. The Linux
      # SwiftLint cannot load SourceKit, so the rules that need it (`op=lint.partial` names
      # them) are checked by build-and-test, whose check.sh lints again on macOS.
      # The lint caches (SwiftFormat's and SwiftLint's per-file results) and the pinned tools,
      # as main's newest run left them. Only a push to main saves, so every run reads one
      # trusted copy; a cached result is reused only for a file whose bytes, options and tool
      # version are unchanged (ADR 0044).
      - name: Restore the lint caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/net.melisma.Otos.lint-tools
          key: lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-

      - name: Run lint
        run: script/lint.sh

      - name: Save the lint caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/net.melisma.Otos.lint-tools
          key: lint-${{ runner.os }}-${{ github.sha }}

  # Whether this push to main is a tree CI already built and tested (ADR 0062): the ruleset
  # keeps every pull request up to date with main, so its squash merge's tree is the tree of
  # the pull request's head, whose `CI gate` passed before the merge. Then the shards below
  # are skipped; every other event (a pull request, the weekly run, a dispatch, or a push whose
  # tree differs) runs them.
  tested:
    name: Already Tested
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request a main commit came from
      checks: read # that pull request's `CI gate`
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Was this tree tested on its pull request?
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: script/ci-tested-tree.sh "$EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # The build and the tests: the one run of script/check.sh that verifies a change made
  # where there is no Xcode, such as a Claude Code cloud session (CLAUDE.md, "Commands"). It
  # runs the same gates first, then the full tier's build and suite, and prints one
  # `op=test.failure` line per failed test.
  # Three shards side by side: the suite is about 420 CPU-seconds, four minutes on one
  # 3-core runner (ADR 0044 items 13 and 17). Each shard builds from the restored caches and
  # runs a third of the suite; the last one runs everything the other two do not, so no test
  # can fall between them. Main's caches are saved by the Build Cache workflow.
  build-and-test:
    name: Build And Test (Xcode 27) ${{ matrix.shard }}/3
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check.sh picks its tier from the diff against origin/main's merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Select the newest Xcode 27
        id: xcode
        run: script/ci-select-xcode.sh >> "$GITHUB_OUTPUT"

      # The compilation cache (ADR 0044) and the lint caches, as main's newest Build Cache run
      # left them. Every compile job is keyed by its inputs with the checkout path mapped
      # away, so a restored store replays every job this tree shares with main and compiles
      # only what changed. The key names the Xcode build: another Xcode's entries could never
      # be hits.
      - name: Restore the build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/net.melisma.Otos.lint-tools
            build/DerivedData/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      - name: Build and test
        # Below the job's limit, so a run that never ends still reaches the upload below;
        # check.sh reports its own hang long before this (op=check.hang).
        timeout-minutes: 100
        env:
          OTOS_TEST_SHARD: ${{ matrix.shard }}/3
          OTOS_CHECK_FAST_GATES: ubuntuJobs
        run: script/check.sh

      # The look a session with no Mac reads: the dev build this shard tested, launched once per
      # appearance on a library of generated media, its window drawn in each view
      # (script/app-capture.sh).
      # Shard 3 finishes first, so the captures ride on it; a static-tier tree builds no app.
      - name: Capture the app's window
        if: ${{ success() && matrix.shard == 3 }}
        # A backstop only: the script bounds each wait on the app itself and says which
        # step it is in. Two launches of the grid took 54 s (run 45922482801).
        timeout-minutes: 6
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Debug/Otos.app
          if [[ -x "$app/Contents/MacOS/Otos" ]]; then
            script/app-capture.sh "$app" build/captures 60
          else
            echo "op=appCapture phase=skipped reason=noBuild"
          fi

      - name: Upload the captures
        if: ${{ always() && matrix.shard == 3 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/captures/
          if-no-files-found: ignore
          retention-days: 14

      # A failed run's diagnostics: the test log, and on a hang the `sample` and
      # `swift-inspect dump-concurrency` that check.sh writes (op=check.hang names them).
      # They are written on GitHub's runner from the generated fixtures and hold no
      # personal data, which is why this public repository can publish them.
      - name: Upload check logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

  # The one required status check. It needs every other job and passes only when each of them
  # succeeded or was skipped, so a cancelled or failed job can never be merged around.
  gate:
    name: CI gate
    if: always()
    needs: [checkout-sanity, repo-shape, text-hygiene, process, lint, tested, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
