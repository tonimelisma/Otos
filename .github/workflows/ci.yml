name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout-sanity:
    name: Checkout Sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify clean checkout
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"

  repo-shape:
    name: Workflow YAML And Script Shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate workflow YAML and script shape
        run: script/ci-repo-shape.sh

  text-hygiene:
    name: Text Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whitespace, conflict markers, requirement authority, and tagged time
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          script/ci-text-hygiene.sh check
          script/requirements-authority-check.sh
          script/time-guard.sh

  lint:
    name: SwiftFormat And SwiftLint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # `script/lint.sh` fetches the pinned, checksummed SwiftFormat and SwiftLint
      # itself (`script/lint-tools.sh`) and never uses whatever the image ships.
      - name: Run lint
        run: script/lint.sh

  required-ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - checkout-sanity
      - repo-shape
      - text-hygiene
      - lint
    if: always()
    steps:
      - name: Check required job results
        env:
          CHECKOUT_RESULT: ${{ needs.checkout-sanity.result }}
          YAML_RESULT: ${{ needs.repo-shape.result }}
          TEXT_RESULT: ${{ needs.text-hygiene.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          for result in "$CHECKOUT_RESULT" "$YAML_RESULT" "$TEXT_RESULT" "$LINT_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required fast verification failed or was cancelled: $result" >&2
              exit 1
            fi
          done
          echo "Required CI gate passed."
