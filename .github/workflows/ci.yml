name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout-sanity:
    name: Checkout Sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify clean checkout
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"

  repo-shape:
    name: Workflow YAML And Script Shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate workflow YAML and script shape
        run: script/ci-repo-shape.sh

  text-hygiene:
    name: Text Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whitespace, conflict markers, requirement authority, and tagged time
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          script/ci-text-hygiene.sh check
          script/requirements-authority-check.sh
          script/time-guard.sh

  lint:
    name: SwiftFormat And SwiftLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # `script/lint.sh` fetches the pinned, checksummed SwiftFormat and SwiftLint
      # itself (`script/lint-tools.sh`) and never uses whatever the image ships. The Linux
      # SwiftLint cannot load SourceKit, so the rules that need it (`op=lint.partial` names
      # them) are checked by build-and-test, whose check.sh lints again on macOS.
      # The lint caches (SwiftFormat's and SwiftLint's per-file results) and the pinned tools,
      # as main's newest run left them. Only a push to main saves, so every run reads one
      # trusted copy; a cached result is reused only for a file whose bytes, options and tool
      # version are unchanged (ADR 0044).
      - name: Restore the lint caches
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/net.melisma.Otos.lint-tools
          key: lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-

      - name: Run lint
        run: script/lint.sh

      - name: Save the lint caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/net.melisma.Otos.lint-tools
          key: lint-${{ runner.os }}-${{ github.sha }}

  # The build and the tests: the one run of script/check.sh that verifies a change made
  # where there is no Xcode, such as a Claude Code cloud session (AGENTS.md, "Cloud
  # Sessions"). It runs the same gates first, then the full tier's build and suite, and
  # prints one `op=test.failure` line per failed test.
  build-and-test:
    name: Build And Test (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # check.sh picks its tier from the diff against origin/main's merge base.
          fetch-depth: 0

      - name: Select the newest Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      # The compilation cache (ADR 0044) and the lint caches, as main's newest run left them.
      # Every compile job is keyed by its inputs with the checkout path mapped away, so a
      # restored store replays every job this tree shares with main and compiles only what
      # changed. Only a push to main saves. The key names the Xcode build: another Xcode's
      # entries could never be hits.
      - name: Restore the build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/net.melisma.Otos.lint-tools
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      - name: Build and test
        # Below the job's limit, so a run that never ends still reaches the upload below;
        # check.sh reports its own hang long before this (op=check.hang).
        timeout-minutes: 100
        run: script/check.sh

      - name: Save the build caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/net.melisma.Otos.lint-tools
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}

      # A failed run's diagnostics: the test log, and on a hang the `sample` and
      # `swift-inspect dump-concurrency` that check.sh writes (op=check.hang names them).
      # They are written on GitHub's runner from the generated fixtures and hold no
      # personal data, which is why this public repository can publish them.
      - name: Upload check logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

  required-ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - checkout-sanity
      - repo-shape
      - text-hygiene
      - lint
      - build-and-test
    if: always()
    steps:
      - name: Check required job results
        env:
          CHECKOUT_RESULT: ${{ needs.checkout-sanity.result }}
          YAML_RESULT: ${{ needs.repo-shape.result }}
          TEXT_RESULT: ${{ needs.text-hygiene.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          set -euo pipefail
          for result in "$CHECKOUT_RESULT" "$YAML_RESULT" "$TEXT_RESULT" "$LINT_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required verification failed or was cancelled: $result" >&2
              exit 1
            fi
          done
          echo "Required CI gate passed."
