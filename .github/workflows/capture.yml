# Builds the dev app and captures every view of its window, light and dark, on a library of
# generated media (script/app-capture.sh). By hand on any branch: the look a cloud session takes
# at a branch whose CI run built no app (the static tier), or before it pushes a fix. Weekly on
# main, on a larger generated library than a commit's CI uses, so a view that draws wrongly
# only with more media shows up without a merge. Outside a commit's check. Its captures hold
# generated media only.
name: Capture The App

on:
  schedule:
    - cron: "17 7 * * 3"
  workflow_dispatch:
    inputs:
      photos:
        description: "How many generated photos the library holds"
        required: true
        default: "60"
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Capture The App
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode 27
        id: xcode
        run: script/ci-select-xcode.sh >> "$GITHUB_OUTPUT"

      - name: Restore the build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/net.melisma.Otos.lint-tools
            build/DerivedData/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      # The input reaches the shell as an environment value, never as text in the script. The
      # weekly run has no input and captures a library of 300 generated photos.
      - name: Build and capture
        env:
          PHOTOS: ${{ inputs.photos || '300' }}
        run: |
          set -euo pipefail
          [[ "$PHOTOS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a count: $PHOTOS"; exit 2; }
          script/build.sh
          script/app-capture.sh build/DerivedData/Build/Products/Debug/Otos.app build/captures "$PHOTOS"

      - name: Upload the captures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/captures/
          if-no-files-found: ignore
          retention-days: 14
