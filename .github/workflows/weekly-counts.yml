# The weekly benchmark counts on GitHub's Xcode 27 runner (ADR 0043, plan 0118 step 4):
# script/bench.sh compare of main's head against the newest commit this runner type has
# records of, each side measured in several test processes, the records kept as git notes
# (refs/notes/benchmarks) pushed back to the repository. Instruction rises decide nothing:
# a flagged case is reported, never a failure; the owner says whether one is work. It
# first asks whether this runner's virtual Mac reads the instruction counters at all, and
# measures nothing when it does not.
name: Weekly Counts

on:
  schedule:
    # Mondays 10:43 UTC: outside the hours GitHub delays scheduled runs, on a minute of its own.
    - cron: "43 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write # the benchmark notes

concurrency:
  group: weekly-counts
  cancel-in-progress: false

jobs:
  counts:
    name: Weekly Counts
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the benchmark records
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/notes/benchmarks > /dev/null; then
            git fetch origin "+refs/notes/benchmarks:refs/notes/benchmarks"
          else
            echo "op=weeklyCounts phase=noRecordsYet"
          fi

      - name: Select the newest Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      # The counts are instructions retired, which a virtual Mac may not expose: a reading of
      # zero means there is nothing to compare, and the run says so and measures nothing.
      - name: Are the instruction counters readable here?
        id: counters
        run: |
          set -euo pipefail
          reading="$(/usr/bin/python3 -I script/lib/proc-rusage.py $$)"
          instructions="$(printf '%s' "$reading" | /usr/bin/python3 -I -c 'import json, sys; print(json.loads(sys.stdin.read())["instructions"])')"
          echo "op=weeklyCounts phase=counters instructions=$instructions model=$(sysctl -n hw.model)"
          if [[ "$instructions" -gt 0 ]]; then
            echo "readable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This runner reads zero instructions retired, so no count was measured (plan 0118 step 4)."
            echo "readable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the build caches
        if: steps.counters.outputs.readable == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/net.melisma.Otos.lint-tools
            build/DerivedData/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      - name: Count main against the last measured commit
        if: steps.counters.outputs.readable == 'true'
        timeout-minutes: 100
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          head="$(git rev-parse HEAD)"
          base="$(script/bench.sh last-measured)"
          echo "op=weeklyCounts phase=start head=$head base=${base:-none}"
          status=0
          script/bench.sh compare "${base:-$head}" "$head" || status=$?
          case "$status" in
            0) echo "op=weeklyCounts phase=finish outcome=noRise" ;;
            3) echo "::notice::Instruction rises are flagged above (op=bench phase=flagged); they decide nothing." ;;
            *) echo "op=weeklyCounts phase=failed benchStatus=$status" >&2; exit "$status" ;;
          esac
          git push origin refs/notes/benchmarks

      - name: Upload the bench logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: weekly-counts-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
