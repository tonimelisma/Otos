# Publishes every main commit that changes the app as an update of the installed app (ADR 0059),
# and only once that commit's `CI gate` has passed (ADR 0062). It starts on the push itself, beside
# CI: script/release.sh builds, signs and launch-checks the app on GitHub's xcode-27 runner while
# CI runs, then waits for CI's `CI gate` on the same commit and publishes only if it succeeded.
# A failed gate publishes nothing; a cancelled one (a newer push superseded it) is skipped.
#
# Only a push to main reaches this workflow, and the `release` environment admits only main (its
# deployment branch policy), so a pull request, whoever opened it, never reaches its secrets.
# The secrets live in Azure Key Vault. The job's first step signs in keylessly: GitHub's OIDC
# token for this job is exchanged for a vault token of an Entra app that trusts only
# repo:tonimelisma/Otos:environment:release and may read only these secrets. The environment
# holds no secrets, only the variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_KEY_VAULT. The
# step masks each value and puts it in the job's environment:
#   OTOS_CERTIFICATE_P12        the maintainer's "Apple Development" certificate and its private
#                               key, .p12, base64 (vault secret apple-development-p12-base64)
#   OTOS_CERTIFICATE_PASSWORD   that export's password (apple-development-p12-password)
#   OTOS_DEVELOPMENT_TEAM       the team ID, kept out of the repository (apple-development-team)
#   OTOS_SPARKLE_PRIVATE_KEY    the update key (Sparkle's generate_keys -x; otos-sparkle-private-key);
#                               its public half is OTOS_SPARKLE_PUBLIC_ED_KEY in Otos.xcodeproj
# A secret the vault does not give fails the fetch, and the job publishes nothing.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish Update
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # the release and its assets
      checks: read # this commit's `CI gate`
      id-token: write # the OIDC token the vault sign-in exchanges
    steps:
      - name: Fetch release secrets from Azure Key Vault
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          # ENV_NAME=vault-secret-name, one per line
          SECRET_MAP: |
            OTOS_CERTIFICATE_P12=apple-development-p12-base64
            OTOS_CERTIFICATE_PASSWORD=apple-development-p12-password
            OTOS_DEVELOPMENT_TEAM=apple-development-team
            OTOS_SPARKLE_PRIVATE_KEY=otos-sparkle-private-key
        run: |
          set -euo pipefail
          j() { python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"; }
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | j value)
          echo "::add-mask::$oidc"
          tok=$(curl -sSf "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            -d client_id="$AZURE_CLIENT_ID" -d grant_type=client_credentials \
            --data-urlencode scope=https://vault.azure.net/.default \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode client_assertion="$oidc" | j access_token)
          echo "::add-mask::$tok"
          while IFS='=' read -r name secret; do
            [ -n "$name" ] || continue
            v=$(curl -sSf -H "Authorization: Bearer $tok" \
              "https://$AZURE_KEY_VAULT.vault.azure.net/secrets/$secret?api-version=7.4" | j value)
            echo "::add-mask::$v"
            d="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$d" "$v" "$d" >> "$GITHUB_ENV"
          done <<< "$SECRET_MAP"

      - name: Is the release set up?
        id: ready
        env:
          P12: ${{ env.OTOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ env.OTOS_CERTIFICATE_PASSWORD }}
          TEAM: ${{ env.OTOS_DEVELOPMENT_TEAM }}
          SPARKLE_KEY: ${{ env.OTOS_SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing OTOS_CERTIFICATE_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing OTOS_CERTIFICATE_PASSWORD"
          [ -n "$TEAM" ] || missing="$missing OTOS_DEVELOPMENT_TEAM"
          [ -n "$SPARKLE_KEY" ] || missing="$missing OTOS_SPARKLE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Updates aren't set up yet; empty from Azure Key Vault:$missing. Nothing was published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the pushed commit
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Select the newest Xcode 27
        id: xcode
        if: steps.ready.outputs.ready == 'true'
        run: script/ci-select-xcode.sh >> "$GITHUB_OUTPUT"

      # The resolved Swift packages main's Build Cache saved for these pins, so the build
      # fetches none of them again; script/release.sh seeds its own folder from them.
      - name: Restore the resolved packages
        if: steps.ready.outputs.ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Otos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: The signing certificate, in a keychain of this run's own
        id: keychain
        if: steps.ready.outputs.ready == 'true'
        env:
          P12: ${{ env.OTOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ env.OTOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/release.keychain-db"
          pw="$(uuidgen)"
          echo "::add-mask::$pw"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          # Apple's intermediate that issues development certificates (WWDR G3), pinned by its
          # SHA-256: the runner does not carry it, and without it no chain to Apple's root is built.
          curl -sSfL -o "$RUNNER_TEMP/wwdr-g3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $RUNNER_TEMP/wwdr-g3.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/wwdr-g3.cer" -k "$kc" > /dev/null
          rm -f "$RUNNER_TEMP/wwdr-g3.cer"
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$kc" | awk '/Apple Development/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::no Apple Development identity in OTOS_CERTIFICATE_P12"; exit 1; }
          # Xcode refuses a certificate Apple has revoked, though the keychain lists it as valid.
          # Apple's revocation service is asked here only to explain such a refusal: Xcode decides.
          security find-certificate -a -Z -p "$kc" | awk -v sha="$identity" '
            /^SHA-1 hash:/ { keep = ($3 == sha) }
            keep && /BEGIN CERTIFICATE/ { inside = 1 }
            keep && inside { print }
            keep && /END CERTIFICATE/ { exit }' > "$RUNNER_TEMP/cert.pem"
          if ! security verify-cert -c "$RUNNER_TEMP/cert.pem" -p codeSign -R ocsp -R require; then
            echo "::warning::Apple's revocation check did not accept the certificate in OTOS_CERTIFICATE_P12 (verify-cert's reason above). If Xcode then refuses it as revoked or expired, export the newest valid one into the vault."
          fi
          rm -f "$RUNNER_TEMP/cert.pem"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$kc" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish (script/release.sh)
        if: steps.ready.outputs.ready == 'true'
        env:
          OTOS_DEVELOPMENT_TEAM: ${{ env.OTOS_DEVELOPMENT_TEAM }}
          OTOS_SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
          OTOS_SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          SPARKLE_PRIVATE_KEY: ${{ env.OTOS_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: script/release.sh

      # The launch check's captures of the archive as it shipped (script/release.sh), from
      # generated media only.
      - name: Upload the launch check's captures
        if: ${{ always() && steps.ready.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-captures-${{ github.run_id }}
          path: build/release-captures/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the keychain
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
