# Runs a test suite many times on GitHub's Xcode 27 runner, stopping at its first failure
# (script/check.sh --only with OTOS_TEST_ITERATIONS, ADR 0044 item 19). By hand, it is how a
# session reproduces a failure that shows only sometimes. Weekly on main, it repeats the suites
# that have failed only sometimes before (docs/lessons.md), so a flake that returns is seen
# without waiting for it to fail a pull request. Outside a commit's check.
name: Repeat A Suite

on:
  schedule:
    - cron: "47 8 * * 3"
  workflow_dispatch:
    inputs:
      suite:
        description: "A test suite's type name, as check.sh --only takes it"
        required: true
        type: string
      iterations:
        description: "How many times to run it, at most"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  repeat:
    name: Repeat ${{ matrix.suite }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # By hand: the one suite asked for. Weekly: the suites that have flaked.
        suite: ${{ fromJSON(github.event_name == 'schedule' && '["StallReproductionTests", "RemovableVolumeMonitorLiveDiskImageTests", "MediaOperationCoordinatorTests", "CatalogProjectionShownFirstTests"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the newest Xcode 27
        id: xcode
        run: script/ci-select-xcode.sh >> "$GITHUB_OUTPUT"

      - name: Restore the build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Caches/net.melisma.Otos.lint-tools
            build/DerivedData/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      # The inputs reach the shell as environment values, never as text in the script.
      - name: Repeat the suite
        timeout-minutes: 110
        env:
          SUITE: ${{ matrix.suite }}
          OTOS_TEST_ITERATIONS: ${{ inputs.iterations || '20' }}
          OTOS_CHECK_FAST_GATES: ubuntuJobs
        run: |
          set -euo pipefail
          [[ "$SUITE" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::not a suite name: $SUITE"; exit 2; }
          script/check.sh --only "$SUITE"

      - name: Upload check logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repeat-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
