included:
  - Otos
  - OtosTests
  - OtosUITests

excluded:
  - build
  - DerivedData
  - OtosTests/Fixtures

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

opt_in_rules:
  - array_init
  - closure_end_indentation
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last

disabled_rules:
  - trailing_comma

reporter: xcode
