included:
  - Otos
  - OtosTests
  - OtosUITests

excluded:
  - build
  - DerivedData
  - OtosTests/Fixtures

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
  # Interpolated strings are `op=` log lines and user-facing sentences. Both stay
  # whole on one line so a grep for the literal finds its source.
  ignores_interpolated_strings: true

# Size limits are soft warnings, not hard errors: cohesion sets file/type
# boundaries, not an arithmetic cap. Do not re-add `error:` here, and do not split
# a cohesive type only to satisfy these (AGENTS.md, Boundaries).
type_body_length:
  warning: 400

file_length:
  warning: 600

function_body_length:
  warning: 50

# SwiftFormat's wrapMultilineStatementBraces puts `{` on its own line after a
# multi-line condition, signature, or type header; accept exactly that shape so the
# formatter and the linter agree.
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true

# Test suites are named `<TypeUnderTest><Aspect>Tests`, which runs past the
# 40-character default for the longer production type names.
type_name:
  max_length:
    warning: 50

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

opt_in_rules:
  - array_init
  - closure_end_indentation
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last

disabled_rules:
  - trailing_comma

custom_rules:
  structured_log_via_helper:
    name: "Structured op= log must use an Operation helper"
    regex: '\.(debug|info)\(\s*(//[^\n]*\n\s*)?"{1,3}\s*op='
    message: "Emit op=/phase= lines through noticeOperation/errorOperation/debugOperation, never a hand-rolled .debug(\"op=…\") string — level then becomes a deliberate choice instead of an accident."
    severity: error

  projection_catch_substitutes_value:
    name: "A projection read error must not become a value"
    included: 'Otos/Services/CatalogProjection[A-Za-z]*\.swift'
    regex: 'catch\b[^{}]*\{[^{}]*(=\s*(\[\]|\.empty\b|0\b)|return\s+(\[\]|\.empty\b|0\b))'
    message: "A failed Store read publishes nothing (ADR 0032, rule 4): throw it to the pass instead of assigning or returning [], .empty or 0 in a catch."
    severity: error

  error_becomes_value:
    name: "A failed operation must not become a value"
    included: 'Otos/.*\.swift'
    regex: 'try\?[^\n]*\?\?\s*(\[\]|\[:\]|0\b|""|false\b|\.empty\b)'
    message: "An error is not a fact (ADR 0032, rule 4): `try? … ?? []/0/\"\"/false/.empty` turns a failure into a value someone reads as true. Handle the error (log it, publish nothing, report it), or keep the result Optional so unknown stays unknown."
    severity: error

  wall_clock_interval:
    name: "An interval inside the process is measured on ContinuousClock"
    regex: 'Date\(\)\.(timeIntervalSince|addingTimeInterval)\(|\btimeIntervalSinceNow\b|Date\.distant(Past|Future)\b|Date\(timeIntervalSinceNow:'
    message: "A process-local deadline or elapsed time uses ContinuousClock.Instant and Duration (DiagnosticsTiming): the wall clock can jump, run backwards or stop across sleep. Date is for persisted or displayed timestamps."
    severity: error

reporter: xcode
