included:
  - Otos
  - OtosTests
  - OtosUITests

excluded:
  - build
  - DerivedData
  - OtosTests/Fixtures

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# Size limits are soft warnings, not hard errors: cohesion sets file/type
# boundaries, not an arithmetic cap. Do not re-add `error:` here, and do not split
# a cohesive type only to satisfy these (AGENTS.md, Boundaries).
type_body_length:
  warning: 400

file_length:
  warning: 600

function_body_length:
  warning: 50

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

opt_in_rules:
  - array_init
  - closure_end_indentation
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last

disabled_rules:
  - trailing_comma

custom_rules:
  structured_log_via_helper:
    name: "Structured op= log must use an Operation helper"
    regex: '\.(debug|info)\(\s*(//[^\n]*\n\s*)?"{1,3}\s*op='
    message: "Emit op=/phase= lines through noticeOperation/errorOperation/debugOperation, never a hand-rolled .debug(\"op=…\") string — level then becomes a deliberate choice instead of an accident."
    severity: error

reporter: xcode
