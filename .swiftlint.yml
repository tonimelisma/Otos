included:
  - Otos
  - OtosTests
  - OtosUITests

excluded:
  - build
  - DerivedData
  - OtosTests/Fixtures

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# Size limits are soft warnings, not hard errors: cohesion sets file/type
# boundaries, not an arithmetic cap. Do not re-add `error:` here, and do not split
# a cohesive type only to satisfy these (docs/plans/0001-docs-and-process-reset.md).
type_body_length:
  warning: 400

file_length:
  warning: 600

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

opt_in_rules:
  - array_init
  - closure_end_indentation
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last

disabled_rules:
  - trailing_comma

reporter: xcode
