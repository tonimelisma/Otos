# Settings for script/process-check and script/pr-check. One `key = value` per line; lists are
# space-separated globs (* and ? stay inside a path segment, ** crosses segments, a leading **/
# also matches the root).

# Requirement IDs: ARC (architecture and system), APP (product surface), ENR (enrichment) and
# MED (media and originals). Declared in docs/requirements.md as `- **<ID>** ...`.
id_regex = (?:ARC|APP|ENR|MED)-[0-9]{3}[A-Z]?

requirements = docs/requirements.md

# The test files. pr-check requires a `fix` PR to touch one.
tests = OtosTests/**

# Searched for `Validates: <ID>` tags: the tests, and the scripts whose self-tests prove a rule
# (guard scripts and their `self-test`). Scripts are not tests: a `fix` PR cannot satisfy
# pr-check by touching one.
validates = OtosTests/** script/*.sh script/lib/*.py

# Docs whose relative links and cited paths must resolve. docs/research/ is a dated record of
# what was found when, and cites paths as they were then; it is not checked.
docs = CLAUDE.md README.md docs/*.md docs/adr/*.md docs/design/*.md .claude/**/*.md

cited_exts = md swift sh py yml yaml json

ignore_paths = NNNN
